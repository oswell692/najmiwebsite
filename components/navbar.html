<script>
    // Set active class based on current page
    (function() {
        const currentPage = window.location.pathname.split('/').pop() || 'index.html';
        
        document.querySelectorAll('.nav-link-glass').forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage) {
                link.classList.add('active');
            } else {
                link.classList.remove('active');
            }
        });
        
        document.querySelectorAll('#mobile-menu a').forEach(link => {
            const href = link.getAttribute('href');
            if (href === currentPage) {
                link.classList.add('active-mobile');
            } else {
                link.classList.remove('active-mobile');
            }
        });
        
        // Mobile menu toggle with scissors animation
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        if (menuBtn && mobileMenu) {
            const newBtn = menuBtn.cloneNode(true);
            menuBtn.parentNode.replaceChild(newBtn, menuBtn);
            
            newBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                mobileMenu.classList.toggle('hidden');
                this.classList.toggle('active');
            });
        }
        
        // Close menu and reset icon when a mobile link is clicked
        document.querySelectorAll('#mobile-menu a').forEach(link => {
            link.addEventListener('click', function() {
                mobileMenu.classList.add('hidden');
                const btn = document.getElementById('mobile-menu-btn');
                if (btn) {
                    btn.classList.remove('active');
                }
            });
        });
        
        // Close menu when clicking outside
        document.addEventListener('click', function(e) {
            if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                if (!mobileMenu.contains(e.target) && e.target !== menuBtn && !menuBtn.contains(e.target)) {
                    mobileMenu.classList.add('hidden');
                    const btn = document.getElementById('mobile-menu-btn');
                    if (btn) {
                        btn.classList.remove('active');
                    }
                }
            }
        });
        
        // Scroll enlarge effect for navbar
        function handleScrollEnlarge() {
            if (window.scrollY > 100) {
                document.body.classList.add('scrolled');
            } else {
                document.body.classList.remove('scrolled');
            }
        }
        
        handleScrollEnlarge();
        window.addEventListener('scroll', handleScrollEnlarge);
        
        // Scroll to top button
        let scrollTopBtn = document.querySelector('.scroll-top');
        if (!scrollTopBtn) {
            scrollTopBtn = document.createElement('div');
            scrollTopBtn.className = 'scroll-top';
            scrollTopBtn.innerHTML = '<i class="fas fa-arrow-up"></i>';
            document.body.appendChild(scrollTopBtn);
        }
        
        window.addEventListener('scroll', function() {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.add('show');
            } else {
                scrollTopBtn.classList.remove('show');
            }
        });
        
        scrollTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        
        // ========== BLUR + ZOOM ON SCROLL EFFECT ==========
        function initBlurZoomOnScroll() {
            const sections = document.querySelectorAll('section, .service-card, .why-card, .coverage-card, .testimonial-card, .stats-card, .hero-swiper > div, .pt-20 h1, .pt-20 p, .container > div, .grid > div');
            
            sections.forEach((section, index) => {
                if (!section.classList.contains('blur-zoom-on-scroll')) {
                    section.classList.add('blur-zoom-on-scroll');
                    if (index % 6 === 0) section.classList.add('delay-1');
                    if (index % 6 === 1) section.classList.add('delay-2');
                    if (index % 6 === 2) section.classList.add('delay-3');
                    if (index % 6 === 3) section.classList.add('delay-4');
                    if (index % 6 === 4) section.classList.add('delay-5');
                }
            });
            
            const heroContent = document.querySelectorAll('.hero-swiper h1, .hero-swiper p, .hero-swiper a, .bg-blue-700 h1, .bg-blue-700 p');
            heroContent.forEach((el, index) => {
                if (!el.classList.contains('blur-zoom-on-scroll')) {
                    el.classList.add('blur-zoom-on-scroll');
                    if (index === 0) el.classList.add('delay-1');
                    if (index === 1) el.classList.add('delay-2');
                    if (index === 2) el.classList.add('delay-3');
                }
            });
        }
        
        function checkVisibility() {
            const elements = document.querySelectorAll('.blur-zoom-on-scroll');
            const windowHeight = window.innerHeight;
            const triggerOffset = 80;
            
            elements.forEach(element => {
                const rect = element.getBoundingClientRect();
                const isVisible = rect.top < windowHeight - triggerOffset && rect.bottom > triggerOffset;
                
                if (isVisible) {
                    element.classList.add('visible');
                }
            });
        }
        
        window.addEventListener('load', function() {
            initBlurZoomOnScroll();
            checkVisibility();
        });
        
        window.addEventListener('scroll', checkVisibility);
        setTimeout(checkVisibility, 500);
    })();
</script>
